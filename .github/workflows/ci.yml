name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: aimo-brain-starter

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_network
      REGISTRY_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_registry
      BUYER_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_buyer
      SUPPLIER_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_supplier
      BUYER_MCP_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_buyer_mcp
      SUPPLIER_MCP_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/aimo_supplier_mcp
      LLM_PROVIDER: fake
      NETWORK_ADMIN_API_KEY: ci-test-admin-key
      NETWORK_INTERNAL_SERVICE_KEY: ci-test-internal-key
      SERVICE_CREDENTIAL_SIGNING_SECRET: ci-test-signing-secret
      REGISTRY_ALLOW_PRIVATE_NETWORK_CARD_TARGETS: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Create isolated databases
        env:
          PGPASSWORD: password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_network;"
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_registry;"
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_buyer;"
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_supplier;"
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_buyer_mcp;"
          psql -h localhost -U user -d postgres -c "CREATE DATABASE aimo_supplier_mcp;"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy apps packages industries

      - name: Run network-api migrations
        working-directory: aimo-brain-starter/apps/network-api
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run registry-api migrations
        working-directory: aimo-brain-starter/apps/registry-api
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run buyer-agent migrations
        working-directory: aimo-brain-starter/apps/buyer-agent
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run supplier-agent migrations
        working-directory: aimo-brain-starter/apps/supplier-agent
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run buyer-mcp migrations
        working-directory: aimo-brain-starter/apps/buyer-mcp
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run supplier-mcp migrations
        working-directory: aimo-brain-starter/apps/supplier-mcp
        run: uv run --project ../.. alembic -c alembic.ini upgrade head

      - name: Run tests
        run: uv run pytest -v

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aimo-brain-starter/apps/portal
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # M6 needs the built-in node:sqlite module (portal session
          # store), stable only from Node 22 — bumped from 20 for this
          # reason, not merely to chase a newer LTS.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: aimo-brain-starter/apps/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PORTAL_ENVIRONMENT: local
          PORTAL_DATABASE_PATH: ./portal_ci_build.sqlite3

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        working-directory: aimo-brain-starter
        run: uv sync --all-packages

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser-level approval-flow test
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [buyer-agent, supplier-agent, registry-api, buyer-mcp, supplier-mcp]
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.agent }} image
        working-directory: aimo-brain-starter
        run: docker build -f apps/${{ matrix.agent }}/Dockerfile -t aimo-${{ matrix.agent }}:ci .
