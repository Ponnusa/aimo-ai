[project]
name = "aimo-food-wholesale"
version = "0.1.0"
description = "Food-wholesale domain module: RFQ/quote JSON Schemas and mock catalogue/order adapters. No food-specific assumptions live in core packages or apps."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_wholesale"]
