[project]
name = "network-api"
version = "0.1.0"
description = "Registry, organization metadata, trading relationships and public protocol schemas. Independently deployable service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.2",
  "database",
  "trade-protocol",
  "identity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_api"]
