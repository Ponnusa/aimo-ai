[project]
name = "buyer-agent"
version = "0.1.0"
description = "Independent A2A endpoint, buyer-side workflow and private state. Deploys as a separate service from supplier-agent."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.2",
  "database",
  "trade-protocol",
  "agent-runtime",
  "aimo-food-wholesale",
  "a2a-sdk[http-server,fastapi]==1.3.0",
  "httpx>=0.27.2",
  "mcp-integration",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buyer_agent"]
