[project]
name = "supplier-sandbox-erp"
version = "0.1.0"
description = "Realistic sandbox ERP/API system (M7): behaves like an external supplier business system over real HTTP, with its own database. supplier-mcp's sandbox adapter talks to this service; nothing else may reach it or its database directly."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.2",
  "database",
  "identity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_sandbox_erp"]
