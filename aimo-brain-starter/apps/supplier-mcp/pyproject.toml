[project]
name = "supplier-mcp"
version = "0.1.0"
description = "Supplier-organization MCP tool server (catalogue search, inventory, customer price, delivery options). Independently deployable; own database; never shares a connection with buyer-mcp or any agent service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.2",
  "mcp==1.30.0",
  "database",
  "identity",
  "mcp-integration",
  "aimo-food-wholesale",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_mcp"]
