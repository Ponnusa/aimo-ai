[project]
name = "registry-api"
version = "0.1.0"
description = "Agent registration, Agent Card validation, capability-indexed discovery and lifecycle management. Independently deployable service; never shares a database with network-api, buyer-agent or supplier-agent."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.2",
  "database",
  "identity",
  "a2a-sdk[http-server,fastapi]==1.3.0",
  "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry_api"]
