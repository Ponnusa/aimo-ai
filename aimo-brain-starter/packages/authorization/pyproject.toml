[project]
name = "authorization"
version = "0.1.0"
description = "OPA-backed binding policy decisions (M5, docs/ROADMAP.md)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "policy-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authorization"]
