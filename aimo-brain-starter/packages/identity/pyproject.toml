[project]
name = "identity"
version = "0.1.0"
description = "Human (OIDC) and service/agent identity verification. Scaffolded in M0; implemented starting M2 (docs/ROADMAP.md)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "PyJWT[crypto]>=2.9.0",
  "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]
