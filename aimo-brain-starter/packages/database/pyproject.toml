[project]
name = "database"
version = "0.1.0"
description = "Shared SQLAlchemy engine/session construction helpers. Holds no data itself; each service points it at its own database URL only."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "greenlet>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
