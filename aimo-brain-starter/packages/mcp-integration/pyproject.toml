[project]
name = "mcp-integration"
version = "0.1.0"
description = "Thin, domain-agnostic wrapper around the official MCP Python SDK for scoped, authenticated, bounded-retry tool calls over Streamable HTTP."
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0",
  "httpx>=0.27.2",
  "identity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_integration"]
