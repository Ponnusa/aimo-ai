[project]
name = "mcp-integration"
version = "0.1.0"
description = "Thin wrapper around the official MCP Python SDK for scoped, authenticated agent tool calls. Scaffolded in M0; wired to the real SDK starting M3."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_integration"]
