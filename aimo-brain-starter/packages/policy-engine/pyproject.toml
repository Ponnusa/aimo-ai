[project]
name = "policy-engine"
version = "0.1.0"
description = "Industry-independent OPA policy evaluation: subprocess opa-eval wrapper, canonical input hashing and deny-by-default decisions (M5)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "trade-protocol",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_engine"]
