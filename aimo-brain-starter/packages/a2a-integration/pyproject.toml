[project]
name = "a2a-integration"
version = "0.1.0"
description = "Thin wrapper around the official A2A Python SDK for AIMO BRAIN Agent Cards and task envelopes. Scaffolded in M0; wired to the real SDK starting M1."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_integration"]
