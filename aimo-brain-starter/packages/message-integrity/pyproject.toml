[project]
name = "message-integrity"
version = "0.1.0"
description = "Industry-independent per-artifact JWS signing/verification for cross-organization A2A business messages (M5.1): deterministic canonicalization, Ed25519 signatures, JWKS resolution, replay/scope checks."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "trade-protocol",
  "PyJWT[crypto]>=2.9.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/message_integrity"]
