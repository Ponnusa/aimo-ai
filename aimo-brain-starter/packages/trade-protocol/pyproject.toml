[project]
name = "trade-protocol"
version = "0.1.0"
description = "Role-neutral core entities (Organization, Agent, Capability, Relationship, Task, Proposal, Agreement, Authorization, Evidence) and the domain-independent trade lifecycle states."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_protocol"]
