# Railway service config for buyer-mcp.
#
# NOT deployed or verified against a real Railway account in this
# session (no Railway credentials available). This documents the
# intended independent-service shape: its own Dockerfile, its own build
# context, its own env vars (BUYER_MCP_DATABASE_URL,
# SERVICE_CREDENTIAL_SIGNING_SECRET, BUYER_MCP_ORGANIZATION_ID) set
# directly in this Railway service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/buyer-mcp/Dockerfile"

[deploy]
startCommand = "uv run --project . uvicorn buyer_mcp.app:app --host 0.0.0.0 --port 8004"
healthcheckPath = "/health"
